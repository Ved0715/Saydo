name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node packages/saydo/scripts/check-exports.mjs
      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/saydo packages/create-saydo-app; do
            version="$(node -p "require('./$pkg/package.json').version")"
            if [ "$version" != "$tag" ]; then echo "$pkg is $version, tag is $tag"; exit 1; fi
          done
      - name: Publish saydo
        working-directory: packages/saydo
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish create-saydo-app
        working-directory: packages/create-saydo-app
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
