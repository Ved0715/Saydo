name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install Redis (store contract tests run against a real server)
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check every package export resolves
        run: node packages/saydo/scripts/check-exports.mjs
      - name: Templates are in sync with the examples
        run: pnpm templates && git diff --exit-code -- packages/create-saydo-app/templates

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Next.js example (production build, CI=true fails on unreviewed risk changes)
        run: pnpm --filter next-demo build
        env:
          CI: 'true'
      - name: Vite + React Router example
        run: pnpm --filter vite-demo build
        env:
          CI: 'true'

  package:
    name: Install from tarballs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pack
      - name: Scaffold both templates with npx and build them
        run: |
          set -euo pipefail
          root="$PWD"
          saydo_tgz="$(ls "$root"/packages/saydo/saydo-*.tgz)"
          create_tgz="$(ls "$root"/packages/create-saydo-app/create-saydo-app-*.tgz)"
          work="$(mktemp -d)"
          cd "$work"
          for template in next vite; do
            npx --yes "$create_tgz" "app-$template" --template "$template" --yes
            (cd "app-$template" && npm install "$saydo_tgz" && npm install && npm run build)
          done
