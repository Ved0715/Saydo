name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install Redis (store contract tests run against a real server)
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          pnpm vitest run --reporter=default --reporter=github-actions 2>&1 | tee vitest.log
      - name: Show test failures
        if: failure()
        run: node .github/scripts/annotate-failure.mjs vitest.log
      - run: pnpm build
      - name: Check every package export resolves
        run: node packages/saydo/scripts/check-exports.mjs
      - name: Templates are in sync with the examples
        run: pnpm templates && git diff --exit-code -- packages/create-saydo-app/templates

  firestore:
    name: Firestore stores (real emulator)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Grant and conversation store contracts against the Firestore emulator
        working-directory: packages/saydo/test
        run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-saydo "cd ../../.. && pnpm vitest run packages/saydo/test/stores.test.ts"

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Next.js example (production build, CI=true fails on unreviewed risk changes)
        run: pnpm --filter next-demo build
        env:
          CI: 'true'
      - name: Vite + React Router example
        run: pnpm --filter vite-demo build
        env:
          CI: 'true'
      - name: Starters (the create-saydo-app templates)
        run: pnpm --filter next-starter build && pnpm --filter vite-starter build
        env:
          CI: 'true'
      - name: Website (built with Saydo)
        run: pnpm --filter saydo-site build
        env:
          CI: 'true'

  package:
    name: Install from tarballs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pack
      - name: Scaffold both templates with npx and build them
        run: |
          set -euo pipefail
          root="$PWD"
          saydo_tgz="$(ls "$root"/packages/saydo/saydo-*.tgz)"
          create_tgz="$(ls "$root"/packages/create-saydo-app/create-saydo-app-*.tgz)"
          work="$(mktemp -d)"
          cp "$saydo_tgz" "$create_tgz" "$work/"
          cd "$work"
          for template in next vite; do
            # A relative ./ path: npx treats an absolute path as a command to execute.
            npx --yes "./$(basename "$create_tgz")" "app-$template" --template "$template" --yes
            (cd "app-$template" && npm install "../$(basename "$saydo_tgz")" && npm install && CI=true npm run build)
          done
